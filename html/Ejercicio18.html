<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 8 - Calcular Mayor</title>
</head>
<body>

    <script>
        const calcularMayor = (numero1, numero2) => {
            if (numero1 > numero2) {
                document.write(`<h1>Resultado</h1>`);
                document.write(`<p>El número mayor es el primero: <strong>${numero1}</strong></p>`);
            } else if (numero2 > numero1) {
                document.write(`<h1>Resultado</h1>`);
                document.write(`<p>El número mayor es el segundo: <strong>${numero2}</strong></p>`);
            } else {
                document.write(`<h1>Resultado</h1>`);
                document.write(`<p>Ambos números son iguales: <strong>${numero1}</strong></p>`);
            }
        };

        const n1 = parseFloat(prompt("Ingrese el primer número:"));
        const n2 = parseFloat(prompt("Ingrese el segundo número:"));

        if (!isNaN(n1) && !isNaN(n2)) {
            calcularMayor(n1, n2);
        } else {
            document.write(`<p style="color: red;">Error: Por favor, ingrese valores numéricos válidos.</p>`);
        }
    </script>
    
</body>
</html>
