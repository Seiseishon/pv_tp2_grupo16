<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paises Y Capitales</title>
    <link rel="stylesheet" href="../css/style.css"></head>
<body>
    <div class="container">
    <h1>Países y Capitales de América</h1>

    <div class="form-group">
      <label for="selectPais">Seleccioná un país:</label>
      <select id="selectPais">
        <option value="">-- Seleccioná un país --</option>
        <option value="Argentina">Argentina</option>
        <option value="Brasil">Brasil</option>
        <option value="Chile">Chile</option>
        <option value="Colombia">Colombia</option>
        <option value="Peru">Perú</option>
        <option value="Uruguay">Uruguay</option>
        <option value="Bolivia">Bolivia</option>
        <option value="Paraguay">Paraguay</option>
      </select>
    </div>

    <div class="form-group">
      <label for="selectCapital">Capital correspondiente:</label>
      <select id="selectCapital">
        <option value="">-- Seleccioná un país primero --</option>
        <option value="Buenos Aires">Buenos Aires</option>
        <option value="Brasilia">Brasilia</option>
        <option value="Santiago">Santiago</option>
        <option value="Bogotá">Bogotá</option>
        <option value="Lima">Lima</option>
        <option value="Montevideo">Montevideo</option>
        <option value="Sucre">Sucre</option>
        <option value="Asunción">Asunción</option>
      </select>
    </div>

    <p id="mensaje"></p>
  </div>
    <script src="../js/Ejercicio21.js"></script>
</body>
</html>
